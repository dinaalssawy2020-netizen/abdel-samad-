<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عبد الصمد - مواقيت الصلاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12161a;
  --card:#1c2127;
  --card2:#222930;
  --line:#2a333d;
  --muted:#9aa5b1;
  --cyan:#4fc3f7;
  --cyan-dim:rgba(79,195,247,.14);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',system-ui,sans-serif}
body{background:var(--bg);color:#f5f6f7;min-height:100vh;display:flex;justify-content:center;padding:22px 16px}
.wrap{width:100%;max-width:400px}
.top{text-align:center;margin:8px 0 18px}
.top h1{font-size:22px;font-weight:700;letter-spacing:.2px}
.top p{color:var(--muted);font-size:13px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#252d36;border:1px solid #2e3844;color:var(--cyan);padding:6px 14px;border-radius:999px;font-size:13px;margin-top:12px}
.date{color:var(--muted);font-size:13px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid transparent;border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.row.on{background:var(--cyan-dim);border-color:var(--cyan)}
.row.on .name{color:var(--cyan)}
.name{font-weight:700;font-size:15px}
.time{font-weight:500;font-size:15px;opacity:.9}
.hint{font-size:11px;color:var(--muted);margin-top:10px;text-align:left}
.dhikr{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;text-align:center}
.dhikr h3{font-size:14px;color:var(--muted);font-weight:500}
.circle{width:96px;height:96px;margin:14px auto;border-radius:50%;border:2.5px solid var(--cyan);display:grid;place-items:center;font-size:28px;font-weight:700;color:var(--cyan);box-shadow:0 0 18px var(--cyan-dim);cursor:pointer;user-select:none;transition:.12s}
.circle:active{transform:scale(.96);background:var(--cyan-dim)}
.small{margin-top:6px;display:flex;justify-content:center;gap:18px}
.small button{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}
.ayah{margin-top:18px;text-align:center;color:#8ea0b0;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>مواقيت الصلاة</h1>
    <p>ما يحتاجه المسلم للتقرب إلى الله</p>
    <div class="badge" id="loc">📍 جاري تحديد المدينة...</div>
    <div class="date" id="hdate">--</div>
  </div>

  <div class="card" id="list">
    <div class="row" id="r-Fajr"><span class="name">الفجر</span><span class="time" id="t-Fajr">--:--</span></div>
    <div class="row" id="r-Dhuhr"><span class="name">الظهر</span><span class="time" id="t-Dhuhr">--:--</span></div>
    <div class="row" id="r-Asr"><span class="name">العصر</span><span class="time" id="t-Asr">--:--</span></div>
    <div class="row" id="r-Maghrib"><span class="name">المغرب</span><span class="time" id="t-Maghrib">--:--</span></div>
    <div class="row" id="r-Isha"><span class="name">العشاء</span><span class="time" id="t-Isha">--:--</span></div>
    <div class="hint">الصلاة القادمة متعلمة باللون الأزرق</div>
  </div>

  <div class="dhikr">
    <h3 id="zekrText">سبحان الله وبحمده</h3>
    <div class="circle" id="countBtn">0</div>
    <div class="small">
      <button id="resetBtn">تصفير</button>
      <button id="changeBtn">ذكر آخر</button>
    </div>
  </div>

  <div class="ayah">﴿ إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا ﴾</div>
</div>

<script>
// تاريخ اليوم
document.getElementById('hdate').textContent = new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

// عداد تسبيح
let azkar = ["سبحان الله وبحمده","سبحان الله","الحمد لله","الله أكبر","لا إله إلا الله","أستغفر الله"];
let zIndex = 0;
let c = parseInt(localStorage.getItem('abd_samad_count')||'0');
const btn = document.getElementById('countBtn');
const txt = document.getElementById('zekrText');
btn.textContent = c;
btn.onclick = ()=>{ c++; btn.textContent=c; localStorage.setItem('abd_samad_count',c); if(c%33==0){ btn.style.transform='scale(1.08)'; setTimeout(()=>btn.style.transform='',180)} };
document.getElementById('resetBtn').onclick = ()=>{ c=0; btn.textContent=0; localStorage.setItem('abd_samad_count','0'); };
document.getElementById('changeBtn').onclick = ()=>{ zIndex=(zIndex+1)%azkar.length; txt.textContent=azkar[zIndex]; };

// مواقيت - شغالة 100%
async function loadTimes(){
  let city='Cairo', country='Egypt';
  try{
    let r = await fetch('https://ipapi.co/json/');
    let j = await r.json();
    city = j.city || 'Cairo';
    country = j.country_name || 'Egypt';
    document.getElementById('loc').textContent = '📍 '+city;
  }catch(e){
    document.getElementById('loc').textContent = '📍 القاهرة';
  }
  try{
    let res = await fetch('https://api.aladhan.com/v1/timingsByCity?city='+encodeURIComponent(city)+'&country='+encodeURIComponent(country)+'&method=5');
    let data = await res.json();
    let t = data.data.timings;
    setTimes(t);
  }catch(e){
    // لو فشل يجيب القاهرة
    let res2 = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Cairo&country=Egypt&method=5');
    let d2 = await res2.json();
    setTimes(d2.data.timings);
  }
}
function to12(t){
  let [h,m]=t.split(':'); h=+h; let ap = h>=12 ? 'م' : 'ص'; h = h%12 || 12; return h+':'+m+' '+ap;
}
function setTimes(t){
  document.getElementById('t-Fajr').textContent=to12(t.Fajr);
  document.getElementById('t-Dhuhr').textContent=to12(t.Dhuhr);
  document.getElementById('t-Asr').textContent=to12(t.Asr);
  document.getElementById('t-Maghrib').textContent=to12(t.Maghrib);
  document.getElementById('t-Isha').textContent=to12(t.Isha);
  let now = new Date(); let cur = now.getHours()*60+now.getMinutes();
  let order = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
  let next='Fajr';
  for(let p of order){ let [hh,mm]=t[p].split(':'); if(+hh*60+ +mm > cur){ next=p; break; } }
  document.querySelectorAll('.row').forEach(el=>el.classList.remove('on'));
  let active = document.getElementById('r-'+next);
  if(active) active.classList.add('on');
}
loadTimes();
</script>
</body>
        </html>

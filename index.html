<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عبد الصمد</title>
<style>
body{background:#12161a;color:#fff;font-family:Arial;text-align:center;padding:15px}
.card{background:#1c2127;border-radius:15px;padding:15px;margin:15px 0;text-align:right}
button{padding:8px 12px;border-radius:10px;border:1px solid #2a3343;background:#222930;color:#9aa5b1}
button.active{background:rgba(79,195,247,0.15);border-color:#4fc3f7;color:#4fc3f7}
.row{display:flex;justify-content:space-between;background:#222930;padding:10px;border-radius:10px;margin:5px 0}
#countBtn{width:90px;height:90px;border-radius:50%;border:2px solid #4fc3f7;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:35px}
.q-surah{padding:10px;background:#222930;margin:5px 0;border-radius:10px;display:flex;justify-content:space-between}
</style>
</head>
<body>

<h2>عبد الصمد</h2>
<p id="hdate"></p>
<p id="loc">📍 جاري تحديد المدينة</p>
<button id="notifBtn">🔔 فعلي تنبيه الأذان</button>

<div class="card" id="prayerCard">تحميل...</div>

<div class="card" style="text-align:center">
<h3 id="zekrText">سبحان الله</h3>
<div id="countBtn">0</div>
<button id="resetBtn">اعادة</button>
</div>

<div class="card">
<p>🌅 اذكار الصباح والمساء</p>
<button class="tab active" id="tab-sabah">الصباح</button>
<button class="tab" id="tab-masa">المساء</button>
<div id="azkarBox" style="margin-top:10px"></div>
</div>

<div class="card">
<p>🛡️ الرقية الشرعية</p>
<button class="tab active" id="tab-r-text">مقروءة</button>
<button class="tab" id="tab-r-audio">مسموعة</button>
<div id="roqyaBox" style="margin-top:10px;line-height:1.8">
بسم الله ارقيك من كل شيء يؤذيك
من شر كل نفس او عين حاسد الله يشفيك
</div>
</div>

<div class="card">
<p>📖 القرآن - اسلام صبحي</p>
<input id="searchSurah" placeholder="ابحث..." style="width:100%;padding:8px;margin:10px 0">
<div id="qList"></div>
<p id="nowPlaying" style="color:#4fc3f7;font-size:12px">اختار سورة</p>
<audio id="qAudio" controls style="width:100%"></audio>
</div>

<script>
// التاريخ
var d = new Date();
document.getElementById('hdate').innerHTML = d.toLocaleDateString('ar-EG');

// عداد
var count = 0;
var btn = document.getElementById('countBtn');
btn.onclick = function(){
count++;
btn.innerHTML = count;
}

// اذكار
var sabah = [
{t:'اصبحنا واصبح الملك لله', d:'مرة'},
{t:'اللهم بك اصبحنا', d:'مرة'},
{t:'اية الكرسي', d:'مرة'}
];
var masa = [
{t:'امسينا وامسى الملك لله', d:'مرة'},
{t:'اللهم بك امسينا', d:'مرة'}
];

function showAzkar(list){
var box = document.getElementById('azkarBox');
box.innerHTML = '';
for(var i=0;i<list.length;i++){
box.innerHTML = box.innerHTML + '<div class="row"><span>'+list[i].d+'</span><span>'+list[i].t+'</span></div>';
}
}
showAzkar(sabah);

document.getElementById('tab-sabah').onclick = function(){
showAzkar(sabah);
this.className = 'tab active';
document.getElementById('tab-masa').className = 'tab';
}
document.getElementById('tab-masa').onclick = function(){
showAzkar(masa);
this.className = 'tab active';
document.getElementById('tab-sabah').className = 'tab';
}

// الرقية
var roqyaText = document.getElementById('roqyaBox').innerHTML;
document.getElementById('tab-r-text').onclick = function(){
document.getElementById('roqyaBox').innerHTML = roqyaText;
this.className = 'tab active';
document.getElementById('tab-r-audio').className = 'tab';
}
document.getElementById('tab-r-audio').onclick = function(){
this.className = 'tab active';
document.getElementById('tab-r-text').className = 'tab';
var box = document.getElementById('roqyaBox');
box.innerHTML = '<p style="color:#4fc3f7">الرقية الشرعية - اسلام صبحي</p><audio id="roqyaAudio" controls autoplay style="width:100%"><source src="https://server14.mp3quran.net/islam/Rewayat-Hafs-A-n-Assem/002.mp3"></audio>';
}

// قران
var suras = ["الفاتحة","البقرة","ال عمران","النساء","المائدة","الانعام","الاعراف","الانفال","التوبة","يونس","هود","يوسف","الرعد","ابراهيم","الحجر","النحل","الاسراء","الكهف","مريم","طه","الانبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الاحزاب","سبا","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الاحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الانسان","المرسلات","النبا","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الاعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الاخلاص","الفلق","الناس"];

var qList = document.getElementById('qList');
var qAudio = document.getElementById('qAudio');

function showSuras(filter){
qList.innerHTML = '';
for(var i=0;i<suras.length;i++){
var name = suras[i];
var num = i+1;
if(filter && name.indexOf(filter)==-1) continue;
var div = document.createElement('div');
div.className = 'q-surah';
div.innerHTML = '<span>'+num+'. '+name+'</span><span>'+num+'</span>';
div.onclick = function(){
var n = this.innerText.split('.')[0];
var nn = parseInt(n);
qAudio.src = 'https://server14.mp3quran.net/islam/Rewayat-Hafs-A-n-Assem/'+String(nn).padStart(3,'0')+'.mp3';
qAudio.play();
document.getElementById('nowPlaying').innerHTML = 'الان: '+suras[nn-1];
}
qList.appendChild(div);
}
}
showSuras('');

document.getElementById('searchSurah').onkeyup = function(){
showSuras(this.value);
}

// صلاة
fetch('https://api.aladhan.com/v1/timingsByCity?city=Cairo&country=Egypt&method=5')
.then(res=>res.json())
.then(data=>{
var t = data.data.timings;
var html = '';
html += '<div class="row"><span>الفجر</span><span>'+t.Fajr+'</span></div>';
html += '<div class="row"><span>الظهر</span><span>'+t.Dhuhr+'</span></div>';
html += '<div class="row"><span>العصر</span><span>'+t.Asr+'</span></div>';
html += '<div class="row"><span>المغرب</span><span>'+t.Maghrib+'</span></div>';
html += '<div class="row"><span>العشاء</span><span>'+t.Isha+'</span></div>';
document.getElementById('prayerCard').innerHTML = html;
})

</script>
</body>
  </html>

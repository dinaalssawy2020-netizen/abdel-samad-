<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>عبد الصمد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
body{background:#0f1418;color:#e8ecef;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:410px}.top{text-align:center;padding:18px 0}.top h1{font-size:30px;color:#4fc3f7}
.doaa{margin:14px 0;background:#1c242c;border:1px solid #2a3542;border-radius:18px;padding:14px;font-size:14px;color:#4fc3f7;text-align:center;line-height:1.7}
.badge{margin:10px auto;display:flex;justify-content:center;background:#1c242c;border:1px solid #2a3542;color:#4fc3f7;padding:8px 16px;border-radius:20px;font-size:13px;width:fit-content}
.date{color:#4fc3f7;font-size:13px;margin-top:8px}
.notif{margin:12px auto;display:block;background:transparent;border:1px solid #3a4b5a;color:#4fc3f7;padding:9px 18px;border-radius:20px;font-size:13px;cursor:pointer}
.card-time{background:#1c242c;border:1px solid #3a4b5a;border-radius:22px;padding:16px;margin:16px 0}.row-time{display:flex;justify-content:space-between;background:#232e38;border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card-sebha{background:#1c242c;border:1px solid #3a4b5a;border-radius:22px;padding:24px;text-align:center;margin-bottom:16px}
.circle{width:115px;height:115px;margin:18px auto;border-radius:50%;border:2.5px solid #4fc3f7;display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer}
.small{margin-top:10px;display:flex;justify-content:center;gap:28px}.small button{background:none;border:none;color:#4fc3f7;font-size:13px;cursor:pointer}
.card-box{background:#1c242c;border:1.5px solid #3a4b5a;border-radius:22px;padding:18px;margin-bottom:16px}.title{color:#4fc3f7;font-size:18px;font-weight:700;margin-bottom:14px;text-align:right}
.tabs{display:flex;gap:10px;margin-bottom:14px}.tab{flex:1;padding:10px;border-radius:12px;border:1.5px solid #3a4b5a;background:#232e38;color:#8a9aa8;font-size:14px;cursor:pointer}.tab.active{border-color:#4fc3f7;background:#253543;color:#4fc3f7}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #3a4b5a;background:#232e38;color:#fff;margin-bottom:12px}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.q-item{display:flex;justify-content:space-between;background:#232e38;border-radius:12px;padding:12px 14px;font-size:13px;cursor:pointer;border:1px solid transparent}.q-item.active{border-color:#4fc3f7;background:#253543;color:#4fc3f7}
.player-box{background:#0f1418;border:1px solid #2a3542;border-radius:14px;padding:12px;margin-top:12px}.play-btn{width:50px;height:50px;border-radius:50%;background:#4fc3f7;border:none;font-size:20px;cursor:pointer;color:#0f1418}.progress{width:100%;height:5px;background:#232e38;border-radius:5px;margin-top:10px;cursor:pointer}.progress-bar{height:100%;background:#4fc3f7;width:0%}.ayah{text-align:center;color:#4fc3f7;font-size:13px;margin:18px 0}.footer{text-align:center;font-size:12px;margin:26px 0 10px;line-height:1.8;color:#4fc3f7}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>عبد الصمد</h1><p class="date" id="gDate"></p>
<div class="doaa" id="doaaBox"></div>
<div class="badge" id="loc">Loading location...</div>
<p class="date" id="hDate"></p>
<button class="notif" id="notifBtn">🔔 فعل تنبيه الأذان</button>
</div>
<div class="card-time" id="prayerCard">Loading prayers...</div>
<div class="card-sebha"><h3 id="zekrText" style="color:#4fc3f7">سبحان الله</h3><div class="circle" id="countBtn">0</div><div class="small"><button id="newWirdBtn">ورد جديد</button><button id="resetBtn">إعادة</button></div></div>
<div class="card-box"><div class="title">الرقية الشرعية 🛡️</div><div class="tabs"><button class="tab active" id="tab-masmou3a">مسموعة</button><button class="tab" id="tab-maktouba">مكتوبة</button></div><div id="roqyaContent"></div></div>
<div class="card-box"><div class="title">القرآن الكريم 🎧</div><div class="tabs"><button class="tab active" id="tab-islam">إسلام صبحي</button><button class="tab" id="tab-maher">ماهر المعيقلي</button></div><input class="search" id="searchSurah" placeholder="ابحث عن سورة..."><div class="q-grid" id="qList"></div><div class="player-box"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><span id="playerName" style="color:#4fc3f7;font-size:13px">▶ اضغط على سورة للتشغيل</span><span id="playerTime" style="color:#8a9aa8;font-size:12px">0:00 / 0:00</span></div><div style="display:flex;justify-content:center;gap:15px"><button id="prevBtn" style="background:#232e38;border:1px solid #3a4b5a;color:#4fc3f7;width:38px;height:38px;border-radius:50%">⏮</button><button class="play-btn" id="mainPlayBtn">▶</button><button id="nextBtn" style="background:#232e38;border:1px solid #3a4b5a;color:#4fc3f7;width:38px;height:38px;border-radius:50%">⏭</button></div><div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div></div><audio id="qAudio"></audio><audio id="adhanAudio" src="https://cdn.islamic.network/adhan/audio/128/ar_abdulrahmanalsudais.mp3" preload="none"></audio></div>
<div class="ayah">﴿ إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا ﴾</div>
<div class="footer">created by dina alssawy <br>All Rights Reserved © 2026</div>
</div>
<script>
// ===== عدلي الدعاء من هنا بس =====
const DOAA_TEXT = "اللهم أتمم عافيته ويسر أمره وبارك له";
// ================================
document.getElementById('doaaBox').textContent = DOAA_TEXT;

var weekdays=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],months=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"],now=new Date();
document.getElementById('gDate').textContent=weekdays[now.getDay()]+"، "+now.getDate()+" "+months[now.getMonth()]+" "+now.getFullYear();
var azkar=["سبحان الله","الحمد لله","لا إله إلا الله","الله أكبر","أستغفر الله"],awrad=["سبحان الله وبحمده 100 مرة","أستغفر الله العظيم 100 مرة","الصلاة على النبي 100 مرة","لا حول ولا قوة إلا بالله 100 مرة"],idx=0,cnt=0,tEl=document.getElementById('zekrText'),cEl=document.getElementById('countBtn');
function upd(){cEl.textContent=cnt}upd();cEl.onclick=function(){cnt++;if(cnt>33){cnt=0;idx=(idx+1)%azkar.length;tEl.textContent=azkar[idx]}upd()};
document.getElementById('resetBtn').onclick=function(){cnt=0;upd()};document.getElementById('newWirdBtn').onclick=function(){tEl.textContent=awrad[Math.floor(Math.random()*awrad.length)];cnt=0;upd()};
function formatTime(s){if(isNaN(s))return"0:00";var m=Math.floor(s/60),sec=Math.floor(s%60);return m+":"+(sec<10?"0"+sec:sec)}
var prayerTimings=null,notifEnabled=localStorage.getItem('adhanNotif')==='1';
function updateNotifBtn(){var b=document.getElementById('notifBtn');b.textContent=notifEnabled?'✅ تم تفعيل تنبيه الأذان':'🔔 فعلي تنبيه الأذان'}updateNotifBtn();
async function requestNotif(){if(!("Notification" in window))return;if(Notification.permission==='granted'){notifEnabled=true;localStorage.setItem('adhanNotif','1');updateNotifBtn();return}if(Notification.permission!=='denied'){var p=await Notification.requestPermission();if(p==='granted'){notifEnabled=true;localStorage.setItem('adhanNotif','1');updateNotifBtn();new Notification('تم تفعيل تنبيه الأذان 🕌')}}}
document.getElementById('notifBtn').onclick=requestNotif;
function checkAdhan(){if(!notifEnabled||!prayerTimings)return;var n=new Date(),cur=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');for(var name in prayerTimings){if(prayerTimings[name].substring(0,5)===cur){var last=localStorage.getItem('lastAdhan');if(last===cur+'-'+n.getDate())return;localStorage.setItem('lastAdhan',cur+'-'+n.getDate());document.getElementById('adhanAudio').play().catch(()=>{});if(Notification.permission==='granted')new Notification('أذان '+name,{body:document.getElementById('loc').textContent})}}}setInterval(checkAdhan,30000);

var roqyaList=[{name:"الرقية - البقرة",src:"https://server14.mp3quran.net/islam/Rewayat-Hafs-A-n-Assem/002.mp3"},{name:"رقية الحسد - الصافات",src:"https://server14.mp3quran.net/islam/Rewayat-Hafs-A-n-Assem/037.mp3"},{name:"رقية السحر - الجن",src:"https://server14.mp3quran.net/islam/Rewayat-Hafs-A-n-Assem/072.mp3"},{name:"المعوذات",src:"https://server14.mp3quran.net/islam/Rewayat-Hafs-A-n-Assem/112.mp3"}],roqyaIndex=0;
function getRoqyaHTML(){var h='<div style="background:#0f1418;border:1px solid #2a3542;border-radius:14px;padding:12px"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><span id="roqyaName" style="color:#4fc3f7;font-size:12px">▶ '+roqyaList[roqyaIndex].name+'</span><span id="roqyaTime" style="color:#8a9aa8;font-size:12px">0:00 / 0:00</span></div><div class="q-grid" style="margin-bottom:10px">';for(var i=0;i<roqyaList.length;i++)h+='<div class="q-item '+(i==roqyaIndex?'active':'')+'" onclick="playRoqya('+i+')" style="font-size:11px">'+roqyaList[i].name+'</div>';h+='</div><div style="display:flex;justify-content:center;gap:15px"><button id="roqyaPrev" style="background:#232e38;border:1px solid #3a4b5a;color:#4fc3f7;width:38px;height:38px;border-radius:50%">⏮</button><button id="roqyaPlayBtn" style="width:50px;height:50px;border-radius:50%;background:#4fc3f7;border:none;color:#0f1418;font-size:20px;cursor:pointer">▶</button><button id="roqyaNext" style="background:#232e38;border:1px solid #3a4b5a;color:#4fc3f7;width:38px;height:38px;border-radius:50%">⏭</button></div><div class="progress" id="roqyaProgress"><div class="progress-bar" id="roqyaProgressBar"></div></div></div><audio id="roqyaAudioEl" style="display:none"></audio>';return h}
var roqyaTextHTML='<div style="line-height:2;font-size:14px;color:#d7e1eb">بسم الله أرقيك من كل شيء يؤذيك<br>الفاتحة 7 مرات - آية الكرسي - الإخلاص والفلق والناس 3 مرات</div>';
document.getElementById('roqyaContent').innerHTML=getRoqyaHTML();
function playRoqya(i){roqyaIndex=i;document.getElementById('roqyaContent').innerHTML=getRoqyaHTML();setTimeout(function(){var a=document.getElementById('roqyaAudioEl');a.src=roqyaList[i].src;a.play();initRoqya();},100)}
function initRoqya(){var a=document.getElementById('roqyaAudioEl'),b=document.getElementById('roqyaPlayBtn'),bar=document.getElementById('roqyaProgressBar'),time=document.getElementById('roqyaTime'),prog=document.getElementById('roqyaProgress'),prev=document.getElementById('roqyaPrev'),next=document.getElementById('roqyaNext');if(!a)return;if(!a.src)a.src=roqyaList[roqyaIndex].src;b.onclick=function(){a.paused?a.play():a.pause()};prev.onclick=function(){playRoqya(roqyaIndex>0?roqyaIndex-1:roqyaList.length-1)};next.onclick=function(){playRoqya(roqyaIndex<roqyaList.length-1?roqyaIndex+1:0)};a.onplay=function(){b.textContent="⏸"};a.onpause=function(){b.textContent="▶"};a.ontimeupdate=function(){if(a.duration){bar.style.width=(a.currentTime/a.duration)*100+"%";time.textContent=formatTime(a.currentTime)+" / "+formatTime(a.duration)}};a.onended=function(){playRoqya(roqyaIndex<roqyaList.length-1?roqyaIndex+1:0)};prog.onclick=function(e){var r=this.getBoundingClientRect();a.currentTime=((e.clientX-r.left)/r.width)*a.duration}}
setTimeout(initRoqya,200);
document.getElementById('tab-masmou3a').onclick=function(){this.classList.add('active');document.getElementById('tab-maktouba').classList.remove('active');document.getElementById('roqyaContent').innerHTML=getRoqyaHTML();setTimeout(initRoqya,200)};
document.getElementById('tab-maktouba').onclick=function(){this.classList.add('active');document.getElementById('tab-masmou3a').classList.remove('active');document.getElementById('roqyaContent').innerHTML=roqyaTextHTML};

var suras=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
var reciters={islam:"https://server14.mp3quran.net/islam/Rewayat-Hafs-A-n-Assem/",maher:"https://server12.mp3quran.net/maher/Rewayat-Hafs-A-n-Assem/"},currentReciter="islam",qListEl=document.getElementById('qList'),qAudio=document.getElementById('qAudio'),playerName=document.getElementById('playerName'),playerTime=document.getElementById('playerTime'),mainPlayBtn=document.getElementById('mainPlayBtn'),progressBar=document.getElementById('progressBar'),currentIndex=-1;
function playSurah(num){currentIndex=num-1;qAudio.src=reciters[currentReciter]+String(num).padStart(3,'0')+'.mp3';qAudio.load();qAudio.play().catch(()=>{});playerName.textContent="▶ الآن: "+suras[currentIndex];mainPlayBtn.textContent="⏸";build(document.getElementById('searchSurah').value)}
function build(f){f=f||'';qListEl.innerHTML='';for(var i=0;i<suras.length;i++){var name=suras[i],num=i+1;if(f&&name.indexOf(f)===-1)continue;var div=document.createElement('div');div.className='q-item'+(i===currentIndex?' active':'');div.innerHTML='<span style="color:#8a9aa8">'+num+'</span><span>'+name+(i===currentIndex?' ▶':'')+'</span>';(function(n){div.onclick=function(){playSurah(n)}})(num);qListEl.appendChild(div)}}build();
document.getElementById('searchSurah').addEventListener('input',function(e){build(e.target.value)});
document.getElementById('tab-islam').onclick=function(){this.classList.add('active');document.getElementById('tab-maher').classList.remove('active');currentReciter="islam";if(currentIndex>=0)playSurah(currentIndex+1)};
document.getElementById('tab-maher').onclick=function(){this.classList.add('active');document.getElementById('tab-islam').classList.remove('active');currentReciter="maher";if(currentIndex>=0)playSurah(currentIndex+1)};
mainPlayBtn.onclick=function(){qAudio.paused?qAudio.play():qAudio.pause()};document.getElementById('nextBtn').onclick=function(){if(currentIndex<113)playSurah(currentIndex+2)};document.getElementById('prevBtn').onclick=function(){if(currentIndex>0)playSurah(currentIndex)};
qAudio.addEventListener('timeupdate',function(){if(qAudio.duration){progressBar.style.width=(qAudio.currentTime/qAudio.duration)*100+"%";playerTime.textContent=formatTime(qAudio.currentTime)+" / "+formatTime(qAudio.duration)}});
qAudio.addEventListener('ended',function(){if(currentIndex<113)playSurah(currentIndex+2)});qAudio.addEventListener('play',function(){mainPlayBtn.textContent="⏸"});qAudio.addEventListener('pause',function(){mainPlayBtn.textContent="▶"});
document.getElementById('progress').onclick=function(e){var r=this.getBoundingClientRect();qAudio.currentTime=((e.clientX-r.left)/r.width)*qAudio.duration};

async function getEnglishCity(lat,lon){
 try{
  const rev=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=en&zoom=10`).then(r=>r.json());
  const a=rev.address||{};
  return a.city||a.town||a.municipality||a.county||a.state||"";
 }catch(e){return ""}
}
async function loadPrayer(){
 try{
  let lat,lon,cityName="";
  try{
   const pos=await new Promise((res,rej)=>{navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:8000})});
   lat=pos.coords.latitude; lon=pos.coords.longitude;
   cityName=await getEnglishCity(lat,lon);
  }catch(gpsErr){
   const ipData=await fetch('https://ipapi.co/json/').then(r=>r.json());
   lat=ipData.latitude; lon=ipData.longitude;
   let enCity=await getEnglishCity(lat,lon);
   cityName=enCity||ipData.city||ipData.region||"";
  }
  if(!cityName) cityName="Giza";
  document.getElementById('loc').textContent=cityName+" 📍";
  const data=await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=5`).then(r=>r.json());
  const t=data.data.timings; prayerTimings=t;
  document.getElementById('prayerCard').innerHTML='<div class="row-time"><span>الفجر</span><span>'+t.Fajr.substring(0,5)+'</span></div><div class="row-time"><span>الظهر</span><span>'+t.Dhuhr.substring(0,5)+'</span></div><div class="row-time"><span>العصر</span><span>'+t.Asr.substring(0,5)+'</span></div><div class="row-time"><span>المغرب</span><span>'+t.Maghrib.substring(0,5)+'</span></div><div class="row-time"><span>العشاء</span><span>'+t.Isha.substring(0,5)+'</span></div>';
  document.getElementById('hDate').textContent=data.data.date.hijri.day+' '+data.data.date.hijri.month.ar+' '+data.data.date.hijri.year;
 }catch(e){
  document.getElementById('loc').textContent="Giza 📍";
  document.getElementById('prayerCard').innerHTML='<div class="row-time"><span>الفجر</span><span>05:38</span></div><div class="row-time"><span>الظهر</span><span>12:39</span></div><div class="row-time"><span>العصر</span><span>15:50</span></div><div class="row-time"><span>المغرب</span><span>18:13</span></div><div class="row-time"><span>العشاء</span><span>19:31</span></div>';
 }
}
loadPrayer();
</script>
</body>
</html>
